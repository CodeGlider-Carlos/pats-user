name: Deploy to app01 (SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-app01
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SSH_HOST: ssh-app01.testdomainconnections.uk
      SSH_USER: debian
      REMOTE_APP_DIR: /var/www/laravel

    steps:
      # Runs first and costs seconds: without it, a missing secret lets
      # cloudflared fall back to interactive browser login and hang until the
      # job timeout. Secrets are resolved at job start, so a run triggered
      # before they were added sees empty values.
      - name: Verify required secrets are present
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET SSH_PRIVATE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Required secret $name is empty or not set."
              missing=1
            else
              # Length only - never the value. Confirms the secret arrived and
              # is the right shape without leaking it.
              printf '  %-24s present, length=%s\n' "$name" "${#value}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Secrets are read when the job starts. If you added them after this"
            echo "run was triggered, start a NEW run (Run workflow) rather than"
            echo "re-running the old one."
            exit 1
          fi

          # Shape checks: a token that is set but malformed fails in ways that
          # look like a network problem, so catch it here instead.
          case "$CF_ACCESS_CLIENT_ID" in
            *.access) ;;
            *) echo "::error::CF_ACCESS_CLIENT_ID must end in '.access' (expected ~39 chars)."; exit 1 ;;
          esac
          case "$CF_ACCESS_CLIENT_ID$CF_ACCESS_CLIENT_SECRET" in
            *[[:space:]]*) echo "::error::Access token secrets contain whitespace - re-paste without newlines."; exit 1 ;;
          esac
          case "$SSH_PRIVATE_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "::error::SSH_PRIVATE_KEY has no PEM header - paste the whole file including BEGIN/END lines."; exit 1 ;;
          esac
          echo "All required secrets are present and well-formed."

      # Placed before the build so a policy problem costs seconds, not a full
      # composer+npm run followed by a six-minute scp hang.
      - name: Verify Cloudflare Access accepts the service token
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Access answers an unauthenticated request with a redirect to its
          # login page. cloudflared reacts to that redirect by starting an
          # interactive browser login, which on a headless runner blocks until
          # ssh times out during banner exchange - an error that looks like a
          # network fault but is really a rejected token. Detect it here.
          response="$(curl -sS -o /dev/null --max-time 20 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -w '%{http_code} %{redirect_url}' \
            "https://$SSH_HOST/")"
          status="${response%% *}"
          location="${response#* }"
          echo "Access responded: HTTP $status"

          case "$location" in
            *cdn-cgi/access/*) ;;
            *) echo "Service token accepted by Access."; exit 0 ;;
          esac

          # The login redirect carries a metadata JWT describing how Access
          # judged THIS request. service_token_status separates "credentials
          # not recognised" from "recognised but not permitted" - two failures
          # that look identical from outside but are fixed in different places.
          meta="$(printf '%s' "$location" | sed -n 's/.*[?&]meta=\([^&]*\).*/\1/p' | cut -d. -f2)"
          case $(( ${#meta} % 4 )) in
            2) meta="$meta==" ;;
            3) meta="$meta=" ;;
          esac
          claims="$(printf '%s' "$meta" | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
          aud="$(printf '%s' "$claims" | sed -n 's/.*"aud":"\([^"]*\)".*/\1/p')"

          echo "::error::Cloudflare Access rejected the service token and redirected to its login page."
          echo "Application AUD serving $SSH_HOST: ${aud:-<could not decode>}"
          echo ""
          case "$claims" in
            *'"service_token_status":true'*)
              echo "Access RECOGNISED the token, so the CF_ACCESS_* secrets are correct."
              echo "The Service Auth policy is not reaching the application above."
              echo "In Zero Trust > Access > Applications, open the app whose AUD tag equals"
              echo "the value printed above and confirm your Service Auth policy is attached"
              echo "to THAT app, and that its rule is Include > Service Token > your token."
              ;;
            *)
              echo "Access did NOT recognise the token (service_token_status=false), so the"
              echo "policy never got a chance to match - this is a credential mismatch."
              echo "  - CF_ACCESS_CLIENT_ID  = full value ending in '.access'  (39 chars)"
              echo "  - CF_ACCESS_CLIENT_SECRET = 64 hex chars, shown ONCE at creation."
              echo "Compare those against the lengths printed by the earlier secrets step."
              echo "If the secret was not captured exactly, rotate the service token and"
              echo "re-paste both values into the repository secrets."
              ;;
          esac
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 (matches app01)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, curl, zip, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify build output exists
        run: test -d public/build || { echo "::error::public/build was not produced by 'npm run build'"; exit 1; }

      # Runtime data lives inside the deployed tree on app01 (.env, storage/,
      # public/images/users/, contratos/). None of it is packaged, so unpacking
      # can never clobber it.
      - name: Package release tarball
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            --exclude='./bootstrap/cache' \
            --exclude='./tests' \
            --exclude='./scripts' \
            --exclude='./tinker' \
            --exclude='./public/storage' \
            --exclude='./public/images/users' \
            --exclude='./contratos' \
            --exclude='./.env' \
            --exclude='./.env.example' \
            --exclude='./.phpunit.result.cache' \
            --exclude='./.phpunit.cache' \
            --exclude='./phpunit.xml' \
            --exclude='./test_db.php' \
            --exclude='./CLAUDE.md' \
            --exclude='./boost.json' \
            --exclude='./.editorconfig' \
            --exclude='*.sql' \
            -C . .
          ls -lh "$RUNNER_TEMP/release.tar.gz"

      # app01 is only reachable through Cloudflare Access, so the runner needs
      # cloudflared for the ProxyCommand plus a service token (below) to
      # authenticate without a browser.
      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the host key when SSH_KNOWN_HOSTS is set; otherwise trust on
          # first use (a fresh runner has no known_hosts, so this is effectively
          # unverified — set the secret to harden it).
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            HOST_KEY_CHECKING=yes
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set - host key is accepted unverified."
            HOST_KEY_CHECKING=accept-new
          fi
          chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

          # ProxyCommand wrapper. Passes the Access service token as explicit
          # flags rather than relying on env inheritance through ssh, and hard
          # fails instead of falling back to interactive browser login - which
          # on a headless runner hangs until the job timeout with no real error.
          cat > ~/.ssh/cf-proxy.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -z "${TUNNEL_SERVICE_TOKEN_ID:-}" ] || [ -z "${TUNNEL_SERVICE_TOKEN_SECRET:-}" ]; then
            echo "cf-proxy: Access service token empty in this process - refusing browser-auth fallback." >&2
            exit 1
          fi
          # --loglevel debug makes cloudflared report why Access accepted or
          # rejected the service token. Drop it once the deploy is green.
          exec cloudflared access ssh \
            --hostname "$1" \
            --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" \
            --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET" \
            --loglevel debug
          SH
          chmod 700 ~/.ssh/cf-proxy.sh

          cat > ~/.ssh/config <<EOF
          Host app01
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking $HOST_KEY_CHECKING
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 60
            ServerAliveInterval 30
            ProxyCommand $HOME/.ssh/cf-proxy.sh %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload release to app01
        timeout-minutes: 6
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: scp "$RUNNER_TEMP/release.tar.gz" app01:/tmp/pats-release.tar.gz

      - name: Activate release on app01
        timeout-minutes: 10
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh app01 "APP_DIR='$REMOTE_APP_DIR' RELEASE='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          TARBALL=/tmp/pats-release.tar.gz
          STAGE="$(mktemp -d /tmp/pats-stage.XXXXXX)"
          BACKUP_DIR="$HOME/deploy-backups"

          cleanup() { rm -rf "$STAGE" "$TARBALL"; }
          trap cleanup EXIT

          echo "==> Preflight"
          [ -f "$APP_DIR/artisan" ] || { echo "ERROR: $APP_DIR/artisan not found - wrong target?"; exit 1; }
          [ -f "$APP_DIR/.env" ]    || { echo "ERROR: $APP_DIR/.env missing - refusing to deploy"; exit 1; }
          sudo -n true 2>/dev/null  || { echo "ERROR: passwordless sudo required for chown/fpm reload"; exit 1; }
          sudo -n -u www-data true 2>/dev/null || { echo "ERROR: cannot run artisan as www-data"; exit 1; }

          echo "==> Unpacking release"
          tar -xzf "$TARBALL" -C "$STAGE"
          [ -f "$STAGE/artisan" ] && [ -d "$STAGE/vendor" ] || { echo "ERROR: release payload incomplete"; exit 1; }

          echo "==> Backing up current code"
          mkdir -p "$BACKUP_DIR"
          tar -czf "$BACKUP_DIR/laravel-$(date +%Y%m%d-%H%M%S).tar.gz" \
            -C "$APP_DIR" --exclude=./vendor --exclude=./storage . 2>/dev/null || true
          ls -1t "$BACKUP_DIR"/laravel-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f

          cd "$APP_DIR"

          # storage/ and bootstrap/cache are owned by www-data:www-data and the
          # debian user is NOT in that group, so artisan must run as www-data or
          # every cache write fails with permission denied.
          artisan() { sudo -n -u www-data php artisan "$@"; }

          echo "==> Maintenance mode on"
          artisan down --retry=15 >/dev/null 2>&1 || true
          # From here a failure leaves the site in maintenance mode on purpose -
          # better than serving a half-swapped tree. Recover with:
          #   sudo -u www-data php artisan up
          trap 'artisan up >/dev/null 2>&1 || true; cleanup' EXIT

          echo "==> Syncing files"
          # Replaced wholesale so removed packages/assets cannot linger.
          rm -rf "$APP_DIR/vendor" "$APP_DIR/public/build"
          cp -a "$STAGE/." "$APP_DIR/"

          echo "==> Rebuilding caches"
          # bootstrap/cache is not shipped in the tarball (www-data owns it), so
          # the package manifest is regenerated here against the new vendor/.
          artisan package:discover >/dev/null
          artisan config:clear >/dev/null
          artisan config:cache >/dev/null
          artisan view:clear >/dev/null
          artisan view:cache >/dev/null
          # route:cache is deliberately skipped: routes/web.php defines a closure
          # route ('/servicios'), which Laravel cannot serialize.
          artisan route:clear >/dev/null

          # Runs as debian, not www-data: the symlink is created in public/,
          # which debian owns.
          [ -L public/storage ] || php artisan storage:link >/dev/null

          echo "==> Ownership and permissions"
          sudo -n chown -R debian:www-data "$APP_DIR"
          sudo -n chown -R www-data:www-data "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
          sudo -n chmod -R 775 "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"

          echo "==> Reloading php8.2-fpm (drops stale opcache)"
          sudo -n systemctl reload php8.2-fpm

          echo "==> Maintenance mode off"
          php artisan up
          trap cleanup EXIT

          echo "==> Deployed ${RELEASE:-unknown}"
          REMOTE

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to app01"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Target: \`$SSH_USER@$SSH_HOST:$REMOTE_APP_DIR\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
